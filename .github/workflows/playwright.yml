name: Playwright Tests
on:
  schedule:
    # Daily at 05:30 UTC.
    - cron: "30 5 * * *"
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_report:
        description: Publish HTML report to GitHub Pages
        type: boolean
        default: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      pages_artifact: ${{ steps.pages-artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            results/report.json
          retention-days: 30
          overwrite: true
      - name: Upload report to MongoDB
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('results/report.json') != '' }}
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/upload-report.mjs
      # Pushes and scheduled runs always publish, manual runs only when publish_report is ticked, PRs never.
      - name: Write report expiry metadata
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish_report) && hashFiles('playwright-report/index.html') != '' }}
        run: |
          cat > playwright-report/report-meta.json <<EOF
          {
            "status": "active",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "expires_at": "$(date -u -d '+24 hours' +%Y-%m-%dT%H:%M:%SZ)",
            "run_url": "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          EOF
      - name: Upload Pages artifact
        id: pages-artifact
        if: ${{ !cancelled() && hashFiles('playwright-report/report-meta.json') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/
          retention-days: 1

  deploy-report:
    needs: test
    if: ${{ !cancelled() && needs.test.outputs.pages_artifact == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Shared with expire-report.yml so a deploy and a cleanup never overlap.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link report in job summary
        run: |
          echo "HTML report (available for 24 hours): ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
